<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Masuk | Broker Point</title>
  <link rel="stylesheet" href="/assets/css/login.css">
  <script src="/assets/js/login.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-card">
      <div class="brand">
        <div class="brand-logo">BP</div>
        <div>
          <strong>Broker Point</strong>
          <span>Production Management System</span>
        </div>
      </div>

      <div class="heading">
        <p class="eyebrow">ADMIN ACCESS</p>
        <h1>Selamat datang</h1>
        <p>Masuk untuk melanjutkan pengelolaan produksi.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Masukkan username"
            maxlength="30"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Masukkan password"
            required
          >
        </div>

        <p id="message" class="message" role="alert" aria-live="polite"></p>

        <button id="loginButton" type="submit">
          <span id="buttonText">Masuk ke aplikasi</span>
        </button>
      </form>

      <div class="security-note">
        Akses terbatas untuk administrator.
      </div>
    </section>

    <footer>Broker Point © 2026</footer>
  </main>
</body>
</html>
